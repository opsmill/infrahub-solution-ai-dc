---
schemas:
  - schemas

objects:
  - objects

menus:
  - menus/menu.yml

queries:
  - name: generate_fabric
    file_path: "./generators/generate_fabric.gql"

  - name: generate_pod
    file_path: "./generators/generate_pod.gql"

  - name: generate_rack
    file_path: "./generators/generate_rack.gql"

  - name: generate_tenant
    file_path: "./generators/generate_tenant.gql"

  - name: network_device_startup_config
    file_path: "./transforms/startup_config.gql"

  - name: computed_interface_description
    file_path: "./transforms/computed_interface_description.gql"

  - name: cabling_plan
    file_path: "./transforms/cabling_plan.gql"


generator_definitions:
  - name: generate-fabric
    file_path: "./generators/generate_fabric.py"
    query: generate_fabric
    targets: fabrics
    parameters:
      fabric_name: name__value
    class_name: FabricGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-pod
    file_path: "./generators/generate_pod.py"
    query: generate_pod
    targets: pods
    parameters:
      pod_name: name__value
    class_name: PodGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-rack
    file_path: "./generators/generate_rack.py"
    query: generate_rack
    targets: racks
    parameters:
      rack_name: name__value
    class_name: RackGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-tenant
    file_path: "./generators/generate_tenant.py"
    query: generate_tenant
    targets: tenants
    parameters:
      name: name__value
    class_name: OverlayGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

jinja2_transforms:
  - name: cisco_device_startup_config
    description: "Cisco device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_cisco.j2"
  - name: arista_device_startup_config
    description: "Arista device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_arista.j2"
  - name: dell_device_startup_config
    description: "Dell device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_dell.j2"

python_transforms:
  - name: computed_interface_description
    class_name: ComputedInterfaceDescription
    file_path: "./transforms/computed_interface_description.py"
  - name: cabling_plan
    class_name: CablingPlan
    file_path: "./transforms/cabling_plan.py"

artifact_definitions:
  - name: "cisco_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "cisco_devices"
    transformation: "cisco_device_startup_config"
  - name: "arista_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "arista_devices"
    transformation: "arista_device_startup_config"
  - name: "dell_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "dell_devices"
    transformation: "dell_device_startup_config"
  - name: "cabling_plan"
    artifact_name: "Cabling Plan"
    parameters:
      name: "name__value"
    content_type: "text/csv"
    targets: "fabrics"
    transformation: "cabling_plan"
