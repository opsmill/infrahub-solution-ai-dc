---
schemas:
  - schemas

objects:
  - objects

menus:
  - menus/menu.yml

queries:
  - name: generate_fabric
    file_path: "./generators/generate_fabric.gql"

  - name: generate_pod
    file_path: "./generators/generate_pod.gql"

  - name: generate_rack
    file_path: "./generators/generate_rack.gql"

  - name: generate_tenant
    file_path: "./generators/generate_tenant.gql"

  - name: generate_server
    file_path: "./generators/generate_server.gql"

  - name: network_device_startup_config
    file_path: "./transforms/startup_config.gql"

  - name: computed_interface_description
    file_path: "./transforms/computed_interface_description.gql"

  - name: cabling_plan
    file_path: "./transforms/cabling_plan.gql"

  - name: cilium_manifest
    file_path: "./transforms/cilium_manifest.gql"

  - name: ArtifactIDs
    file_path: "./queries/artifact_ids.gql"


# Every generator below imports from the shared src/infrahub_solution_ai_dc/ package. The
# dependency closure Infrahub detects for a Python definition is the directory holding its
# file_path -- here ./generators -- so the shared package falls outside it. The watch entries
# add it: without them a change under src/ does not re-run the generators that depend on it.
generator_definitions:
  - name: generate-fabric
    file_path: "./generators/generate_fabric.py"
    query: generate_fabric
    targets: fabrics
    parameters:
      fabric_name: name__value
    class_name: FabricGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false
    watch:
      files:
        - src/infrahub_solution_ai_dc/generator.py
        - src/infrahub_solution_ai_dc/protocols.py
        - src/infrahub_solution_ai_dc/vendors.py
        - src/infrahub_solution_ai_dc/fabric_generator_query.py

  - name: generate-pod
    file_path: "./generators/generate_pod.py"
    query: generate_pod
    targets: pods
    parameters:
      pod_name: name__value
    class_name: PodGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false
    watch:
      files:
        - src/infrahub_solution_ai_dc/sorting.py
        - src/infrahub_solution_ai_dc/addressing.py
        - src/infrahub_solution_ai_dc/cabling.py
        - src/infrahub_solution_ai_dc/generator.py
        - src/infrahub_solution_ai_dc/overlay.py
        - src/infrahub_solution_ai_dc/protocols.py
        - src/infrahub_solution_ai_dc/vendors.py
        - src/infrahub_solution_ai_dc/pod_generator_query.py

  - name: generate-rack
    file_path: "./generators/generate_rack.py"
    query: generate_rack
    targets: racks
    parameters:
      rack_name: name__value
    class_name: RackGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false
    watch:
      files:
        - src/infrahub_solution_ai_dc/sorting.py
        - src/infrahub_solution_ai_dc/addressing.py
        - src/infrahub_solution_ai_dc/cabling.py
        - src/infrahub_solution_ai_dc/overlay.py
        - src/infrahub_solution_ai_dc/protocols.py
        - src/infrahub_solution_ai_dc/vendors.py
        - src/infrahub_solution_ai_dc/rack_generator_query.py

  - name: generate-tenant
    file_path: "./generators/generate_tenant.py"
    query: generate_tenant
    targets: tenants
    parameters:
      name: name__value
    class_name: OverlayGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false
    watch:
      files:
        - src/infrahub_solution_ai_dc/generator.py
        - src/infrahub_solution_ai_dc/overlay.py
        - src/infrahub_solution_ai_dc/protocols.py
        - src/infrahub_solution_ai_dc/generate_tenant_query.py

  - name: generate-server
    file_path: "./generators/generate_server.py"
    query: generate_server
    targets: server_services
    parameters:
      name: name__value
    class_name: ServerGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false
    watch:
      files:
        - src/infrahub_solution_ai_dc/addressing.py
        - src/infrahub_solution_ai_dc/generator.py
        - src/infrahub_solution_ai_dc/protocols.py
        - src/infrahub_solution_ai_dc/server.py
        - src/infrahub_solution_ai_dc/generate_server_query.py


jinja2_transforms:
  - name: cisco_device_startup_config
    description: "Cisco device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_cisco.j2"
  - name: arista_device_startup_config
    description: "Arista device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_arista.j2"
  - name: dell_device_startup_config
    description: "Dell device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_dell.j2"
  - name: juniper_device_startup_config
    description: "Juniper device config transform"
    query: "network_device_startup_config"
    template_path: "./transforms/templates/startup_config_juniper.j2"

python_transforms:
  - name: computed_interface_description
    class_name: ComputedInterfaceDescription
    file_path: ./transforms/computed_interface_description.py
    watch:
      files:
          - ./transforms/computed_interface_description_query.py

  - name: cabling_plan
    class_name: CablingPlan
    file_path: "./transforms/cabling_plan.py"
    # cabling_plan.py imports from the shared src package, which falls outside the closure
    # Infrahub detects for it (the ./transforms directory holding its file_path). Same reason
    # as the generator_definitions above. computed_interface_description needs no entry: it
    # imports only its sibling query model, already inside ./transforms.
    watch:
      files:
        - ./transforms/fabric_cabling_plan_query.py
        - src/infrahub_solution_ai_dc/protocols.py

  - name: cilium_manifest
    class_name: CiliumManifest
    file_path: "./transforms/cilium_manifest.py"
    # Required, not optional: the closure Infrahub detects for a Python transform is the directory
    # holding its file_path (./transforms), and cilium_manifest.py imports the peering module from
    # src/. Without this entry a change to that module would not re-render the manifest.
    watch:
      files:
        - ./transforms/cilium_manifest_query.py
        - src/infrahub_solution_ai_dc/clusters.py

artifact_definitions:
  - name: "cisco_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "cisco_devices"
    transformation: "cisco_device_startup_config"
  - name: "arista_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "arista_devices"
    transformation: "arista_device_startup_config"
  - name: "dell_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "dell_devices"
    transformation: "dell_device_startup_config"
  - name: "juniper_startup_configuration"
    artifact_name: "Startup configuration"
    parameters:
      name: "hostname__value"
    content_type: "text/plain"
    targets: "juniper_devices"
    transformation: "juniper_device_startup_config"
  - name: "cabling_plan"
    artifact_name: "Cabling Plan"
    parameters:
      name: "name__value"
    content_type: "text/csv"
    targets: "fabrics"
    transformation: "cabling_plan"
  # `artifact_name` is the published contract with Vidra: it is what an InfrahubSync CR names in
  # spec.source.artefactName, and Vidra treats a no-match as an empty result rather than an error.
  # Renaming it silently breaks every deployed cluster. The `name` key above it is internal.
  #
  # That one `artifact_name` is shared by EVERY artifact this definition produces — it is not scoped
  # per target (cabling_plan above yields three artifacts all named "Cabling Plan", one per fabric).
  # Vidra selects on the name alone and syncs every match into its single destination, so with two
  # clusters each cluster would also receive the other's documents. v1 therefore supports exactly one
  # Cilium-consuming cluster per Infrahub branch: rendering is correct for any number, delivery cannot
  # disambiguate. Full reasoning in specs/004-kubernetes-cilium-bgp/spec.md (Assumptions) and
  # contracts/cilium-manifest-artifact.md.
  - name: "cilium_bgp_manifest"
    artifact_name: "Cilium BGP Manifest"
    parameters:
      name: "name__value"
    content_type: "application/yaml"
    targets: "kubernetes_clusters"
    transformation: "cilium_manifest"
