---
x-infrahub-custom-build: &infrahub_custom_build
  image: opsmill/infrahub-solution-ai-dc:${INFRAHUB_BASE_VERSION:-1.10.0}
  environment:
    INFRAHUB_GIT_USER_NAME: "infrahub"
    INFRAHUB_GIT_EMAIL: "no-reply@opsmill.com"
    INFRAHUB_GIT_USE_EXPLICIT_MERGE_COMMIT: true
    INFRAHUB_TIMEOUT: 180
    INFRAHUB_GIT_IMPORT_SYNC_BRANCH_NAMES: '["^demo/.*$"]'
    INFRAHUB_API_BACKPRESSURE_MAX_CONCURRENCY_FACTOR: "0.5"
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INFRAHUB_BASE_VERSION: "${INFRAHUB_BASE_VERSION:-1.10.0}"

services:
  infrahub-server:
    <<: *infrahub_custom_build
  database:
    ports:
      - 7474:7474
      - 7687:7687

  task-manager:
    <<: *infrahub_custom_build
    ports:
      - 4200:4200

  task-worker:
    <<: *infrahub_custom_build
    volumes:
      - ./:/upstream
      - ./src:/opt/local/src
      # # When the checkout is a git worktree (e.g. an emdash worktree), /upstream/.git
      # # is a pointer file into the main repo's .git. Mount that main .git at the same
      # # absolute host path so the pointer resolves and /upstream is a valid git remote.
      # - "${EMDASH_ROOT_PATH}/.git:${EMDASH_ROOT_PATH}/.git:ro"
