---
x-infrahub-custom-build: &infrahub_custom_build
  image: opsmill/infrahub-solution-ai-dc:${INFRAHUB_BASE_VERSION:-1.11.0b0}
  environment:
    INFRAHUB_GIT_USER_NAME: "infrahub"
    INFRAHUB_GIT_EMAIL: "no-reply@opsmill.com"
    INFRAHUB_GIT_USE_EXPLICIT_MERGE_COMMIT: true
    INFRAHUB_TIMEOUT: 180
    INFRAHUB_GIT_IMPORT_SYNC_BRANCH_NAMES: '["^demo/.*$"]'
    # The fabric/pod/rack hierarchy is deep enough that path traversals exceed the upstream
    # default of 30s. Lives here, not in docker-compose.yml, so that file stays a verbatim
    # copy of the upstream stack and can be re-vendored on each Infrahub upgrade.
    INFRAHUB_DB_PATH_TRAVERSAL_QUERY_TIMEOUT: 75
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INFRAHUB_BASE_VERSION: "${INFRAHUB_BASE_VERSION:-1.11.0b0}"

services:
  infrahub-server:
    <<: *infrahub_custom_build
  database:
    ports:
      - 7474:7474
      - 7687:7687

  task-manager:
    <<: *infrahub_custom_build
    ports:
      - 4200:4200

  task-worker:
    <<: *infrahub_custom_build
    volumes:
      - ./:/upstream
      - ./src:/opt/local/src

  infrahub-mcp:
    image: "${INFRAHUB_MCP_DOCKER_IMAGE:-registry.opsmill.io/opsmill/infrahub-mcp}:${INFRAHUB_MCP_VERSION:-v1.1.7}"
    restart: unless-stopped
    depends_on:
      infrahub-server:
        condition: service_healthy
    environment:
      INFRAHUB_ADDRESS: "http://infrahub-server:8000"
      INFRAHUB_MCP_AUTH_MODE: token-passthrough
      INFRAHUB_MCP_BRANCH_PATTERN: "mcp/session-{date}-{hex}"
      INFRAHUB_MCP_LOG_LEVEL: ${INFRAHUB_MCP_LOG_LEVEL:-info}
      INFRAHUB_MCP_READ_ONLY: ${INFRAHUB_MCP_READ_ONLY:-false}
    ports:
      - ${INFRAHUB_MCP_PORT:-8001}:8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
