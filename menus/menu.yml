---
apiVersion: infrahub.app/v1
kind: Menu
spec:
  data:
    - namespace: Network
      name: MainMenu
      label: Network
      icon: "mdi:domain"
      kind: OrganizationGeneric
      children:
        data:
          - namespace: Network
            name: Fabric
            label: Fabrics
            kind: NetworkFabric
            icon: "lucide:network"

          - namespace: Network
            name: Pod
            label: Pods
            kind: NetworkPod
            icon: "clarity:pod-line"

          - namespace: Network
            name: Device
            label: Devices
            kind: NetworkDevice
            icon: "mdi:server"

          - namespace: Network
            name: DeviceType
            label: Device Types
            kind: NetworkDeviceType
            icon: "mdi:server"

          - namespace: Network
            name: Link
            label: Connections
            kind: NetworkLink
            icon: "material-symbols:cable"

          - namespace: Network
            name: Overlay
            label: Overlay
            icon: "mdi:lan"
            children:
              data:
                - namespace: Network
                  name: Tenant
                  label: Tenants
                  kind: NetworkTenant
                  icon: "mdi:account-group"
                - namespace: Network
                  name: Vrf
                  label: VRFs
                  kind: NetworkVrf
                  icon: "mdi:router-network"
                - namespace: Network
                  name: Segment
                  label: Segments
                  kind: NetworkSegment
                  icon: "mdi:vector-polyline"
                - namespace: Network
                  name: BGPSession
                  label: BGP Sessions
                  kind: NetworkBGPSession
                  icon: "mdi:swap-horizontal"

          - namespace: Network
            name: Servers
            label: Servers
            icon: "mdi:server-network"
            children:
              data:
                - namespace: Network
                  name: ServerService
                  label: Server Services
                  kind: NetworkServerService
                  icon: "mdi:file-cog"
                - namespace: Network
                  name: Server
                  label: Servers
                  kind: NetworkServer
                  icon: "mdi:server"

    - namespace: Location
      name: Menu
      label: Location
      kind: LocationGeneric
      icon: "mingcute:location-line"
      children:
        data:
          - namespace: Location
            name: Hall
            label: Hall
            kind: LocationHall
            icon: "mdi:building"

          - namespace: Location
            name: Rack
            label: Rack
            kind: LocationRack
            icon: "clarity:rack-server-solid"

    - namespace: Organization
      name: Menu
      label: Organization
      icon: "mdi:domain"
      children:
        data:
          - namespace: Organization
            name: Manufacturer
            label: Manufacturer
            kind: OrganizationManufacturer
            icon: "mdi:domain"
