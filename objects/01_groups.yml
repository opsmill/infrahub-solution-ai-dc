---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    - name: halls
    - name: racks
    - name: fabrics
    - name: pods
    - name: devices
    - name: tenants
    # Per-vendor device groups (children of `devices`). Membership is stamped by the
    # generators from each device's manufacturer; the per-vendor startup-config
    # artifacts target these groups.
    - name: cisco_devices
      parent: devices
    - name: arista_devices
      parent: devices
    - name: dell_devices
      parent: devices
    - name: juniper_devices
      parent: devices
