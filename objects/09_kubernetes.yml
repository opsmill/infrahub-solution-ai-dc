---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkKubernetesCluster
  data:
    # Numbered 09 so the cluster exists before the services in 13_servers.yml declare membership
    # from their side. A cluster has no dependencies of its own, so it can be created this early.
    - name: "cilium-demo"
      description: "Demo Kubernetes cluster: mixed L3 (BGP-speaking) and L2 members across racks."
      member_of_groups: ["kubernetes_clusters"]
