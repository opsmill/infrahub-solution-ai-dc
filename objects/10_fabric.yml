---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "Fabric-A"
      index: 1
      amount_of_super_spines: 6
      super_spine_switch_template: "cisco-9364d-gx2-super-spine-switch"
      fabric_interface_sorting_method: "create_reverse_sorted_device_interface_map"
      member_of_groups: ["fabrics"]
      children:
        kind: NetworkPod
        data:
          - name: "Pod-A1"
            index: 1
            role: "fabric"
            member_of_groups: ["pods"]
          - name: "Pod-A2"
            index: 2
            spine_switch_template: "cisco-9364d-gx2-spine-switch"
            member_of_groups: ["pods"]
          - name: "Pod-A3"
            index: 3
            spine_switch_template: "cisco-9364d-gx2-spine-switch"
            member_of_groups: ["pods"]
    - name: "Fabric-B"
      index: 2
      member_of_groups: ["fabrics"]
      super_spine_switch_template: "arista-7060dx5-64s-super-spine-switch"
      amount_of_super_spines: 4
      children:
        kind: NetworkPod
        data:
          - name: "Pod-B1"
            index: 1
            role: "fabric"
            member_of_groups: ["pods"]
          - name: "Pod-B2"
            index: 2
            spine_switch_template: "arista-7060dx5-64s-spine-switch"
            member_of_groups: ["pods"]
          - name: "Pod-B3"
            index: 3
            spine_switch_template: "arista-7060dx5-64s-spine-switch"
            member_of_groups: ["pods"]
    # Fabric-C — Dell (mirrors Fabric-B's topology; the proven Dell demo relocated here).
    - name: "Fabric-C"
      index: 3
      member_of_groups: ["fabrics"]
      super_spine_switch_template: "dell-z9864f-on-super-spine-switch"
      amount_of_super_spines: 4
      children:
        kind: NetworkPod
        data:
          - name: "Pod-C1"
            index: 1
            role: "fabric"
            member_of_groups: ["pods"]
          - name: "Pod-C2"
            index: 2
            spine_switch_template: "dell-z9864f-on-spine-switch"
            member_of_groups: ["pods"]
          - name: "Pod-C3"
            index: 3
            spine_switch_template: "dell-z9864f-on-spine-switch"
            member_of_groups: ["pods"]
    - name: "Fabric-D"
      index: 4
      member_of_groups: ["fabrics"]
      super_spine_switch_template: "juniper-qfx5230-64cd-super-spine-switch"
      amount_of_super_spines: 4
      children:
        kind: NetworkPod
        data:
          - name: "Pod-D1"
            index: 1
            role: "fabric"
            member_of_groups: ["pods"]
          - name: "Pod-D2"
            index: 2
            spine_switch_template: "juniper-qfx5230-64cd-spine-switch"
            member_of_groups: ["pods"]
          - name: "Pod-D3"
            index: 3
            spine_switch_template: "juniper-qfx5230-64cd-spine-switch"
            member_of_groups: ["pods"]
    # Fabric-E — SONiC. Mirrors Fabric-D's topology; unlike every prior fabric, its three pods deliberately
    # use three different chipset generations (research.md D8) so all three are visible in one running demo:
    # Pod-E1 (super-spine) on the newest silicon, Pod-E2/E3 (spine) on the two established generations.
    - name: "Fabric-E"
      index: 5
      member_of_groups: ["fabrics"]
      super_spine_switch_template: "sonic-t6-super-spine-switch"
      amount_of_super_spines: 4
      children:
        kind: NetworkPod
        data:
          - name: "Pod-E1"
            index: 1
            role: "fabric"
            member_of_groups: ["pods"]
          - name: "Pod-E2"
            index: 2
            spine_switch_template: "sonic-t4-spine-switch"
            member_of_groups: ["pods"]
          - name: "Pod-E3"
            index: 3
            spine_switch_template: "sonic-t5-spine-switch"
            member_of_groups: ["pods"]
    # Fabric-F — Cumulus Linux (NVIDIA Spectrum ASICs). Mirrors Fabric-E's topology; like Fabric-E, its
    # three pods deliberately use three different Spectrum generations (research.md D8) so all three are
    # visible in one running demo: Pod-F1 (super-spine) on the newest silicon, Pod-F2/F3 (spine) on the two
    # established generations.
    - name: "Fabric-F"
      index: 6
      member_of_groups: ["fabrics"]
      super_spine_switch_template: "cumulus-spectrum4-super-spine-switch"
      amount_of_super_spines: 4
      children:
        kind: NetworkPod
        data:
          - name: "Pod-F1"
            index: 1
            role: "fabric"
            member_of_groups: ["pods"]
          - name: "Pod-F2"
            index: 2
            spine_switch_template: "cumulus-spectrum2-spine-switch"
            member_of_groups: ["pods"]
          - name: "Pod-F3"
            index: 3
            spine_switch_template: "cumulus-spectrum3-spine-switch"
            member_of_groups: ["pods"]
