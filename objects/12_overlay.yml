---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkTenant
  data:
    - name: "Blue"
      fabric: "Fabric-A"
      member_of_groups: ["tenants"]
    - name: "Green"
      fabric: "Fabric-D"
      member_of_groups: ["tenants"]
    - name: "Purple"
      fabric: "Fabric-E"
      member_of_groups: ["tenants"]
    - name: "Amber"
      fabric: "Fabric-F"
      member_of_groups: ["tenants"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkVrf
  data:
    - name: "blue-prod"
      tenant: "Blue"
    - name: "green-prod"
      tenant: "Green"
    - name: "purple-prod"
      tenant: "Purple"
    - name: "amber-prod"
      tenant: "Amber"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkSegment
  data:
    # Two routed (IRB) segments; placement left empty -> advertise-all (every leaf in Fabric-A).
    # vlan_id / l2vni / route_target / subnet / gateway are allocated by the OverlayGenerator.
    - name: "blue-web"
      vrf: ["Blue", "blue-prod"]
      routed: true
    - name: "blue-app"
      vrf: ["Blue", "blue-prod"]
      routed: true
    # US3 — rack-scoped IRB segment: rendered only on the leafs of Rack-A2-1.
    - name: "blue-dmz"
      vrf: ["Blue", "blue-prod"]
      routed: true
      racks: ["Rack-A2-1"]
    # US3 — L2-only segment (no gateway): bridged everywhere, no anycast SVI anywhere.
    - name: "blue-l2"
      vrf: ["Blue", "blue-prod"]
      routed: false
    # Fabric-D (Juniper) tenant segments — two routed (IRB) plus one L2-only; placement is left
    # empty so every Fabric-D leaf carries them.
    - name: "green-web"
      vrf: ["Green", "green-prod"]
      routed: true
    - name: "green-app"
      vrf: ["Green", "green-prod"]
      routed: true
    - name: "green-l2"
      vrf: ["Green", "green-prod"]
      routed: false
    # Fabric-E (SONiC) tenant segments — two routed (IRB) plus one L2-only; placement is left empty so
    # every Fabric-E leaf carries them. Scoped to Fabric-E only (research.md D8, spec FR-011): adding
    # tenants to Fabric-B/C would change their rendered configs and violate FR-010.
    - name: "purple-web"
      vrf: ["Purple", "purple-prod"]
      routed: true
    - name: "purple-app"
      vrf: ["Purple", "purple-prod"]
      routed: true
    - name: "purple-l2"
      vrf: ["Purple", "purple-prod"]
      routed: false
    # Fabric-F (Cumulus) tenant segments — two routed (IRB) plus one L2-only; placement is left empty so
    # every Fabric-F leaf carries them. Scoped to Fabric-F only (research.md D8, spec FR-011): adding
    # tenants to other fabrics would change their rendered configs and violate FR-010.
    - name: "amber-web"
      vrf: ["Amber", "amber-prod"]
      routed: true
    - name: "amber-app"
      vrf: ["Amber", "amber-prod"]
      routed: true
    - name: "amber-l2"
      vrf: ["Amber", "amber-prod"]
      routed: false
