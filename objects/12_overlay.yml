---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkTenant
  data:
    - name: "Blue"
      fabric: "Fabric-A"
      member_of_groups: ["tenants"]
    - name: "Green"
      fabric: "Fabric-D"
      member_of_groups: ["tenants"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkVrf
  data:
    - name: "blue-prod"
      tenant: "Blue"
    - name: "green-prod"
      tenant: "Green"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkSegment
  data:
    # Two routed (IRB) segments; placement left empty -> advertise-all (every leaf in Fabric-A).
    # vlan_id / l2vni / route_target / subnet / gateway are allocated by the OverlayGenerator.
    - name: "blue-web"
      vrf: ["Blue", "blue-prod"]
      routed: true
    - name: "blue-app"
      vrf: ["Blue", "blue-prod"]
      routed: true
    # US3 — rack-scoped IRB segment: rendered only on the leafs of Rack-A2-1.
    - name: "blue-dmz"
      vrf: ["Blue", "blue-prod"]
      routed: true
      racks: ["Rack-A2-1"]
    # US3 — L2-only segment (no gateway): bridged everywhere, no anycast SVI anywhere.
    - name: "blue-l2"
      vrf: ["Blue", "blue-prod"]
      routed: false
    # Fabric-D (Juniper) tenant segments — two routed (IRB) plus one L2-only; placement is left
    # empty so every Fabric-D leaf carries them.
    - name: "green-web"
      vrf: ["Green", "green-prod"]
      routed: true
    - name: "green-app"
      vrf: ["Green", "green-prod"]
      routed: true
    - name: "green-l2"
      vrf: ["Green", "green-prod"]
      routed: false
