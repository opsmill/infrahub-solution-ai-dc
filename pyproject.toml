[project]
name = "infrahub-solution-ai-dc"
version = "0.1.0"
description = "Infrahub Solution AI DC"
readme = "README.md"
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
requires-python = ">=3.11, <3.15"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    # >=1.23.0b0 is a hard floor, not a preference: `watch:` on a generator_definition does not
    # exist on InfrahubGeneratorDefinitionConfig before it, and the model forbids extra keys, so
    # .infrahub.yml fails to parse outright on an older SDK.
    "infrahub-sdk[all]>=1.23.0b0",
    "infrahub-testcontainers>=1.11.0b0",
    "invoke>=2.2.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
    "rumdl>=0.1.20",
    "yamllint>=1.37.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true

# protocols.py is generated by `infrahubctl protocols`. Where a node narrows an inherited
# relationship to a concrete peer kind (CoreArtifactTarget.artifacts -> RelationshipManager[CoreArtifact],
# LocationRack.parent -> RelatedNode[LocationHall]), the generator overrides a field with a narrower
# invariant generic, which mypy reports as [assignment]. Narrowing is the point of the generated
# protocols, and the file cannot be hand-fixed without diverging from the generator, so the code is
# suppressed for this module only. Every other error code still applies here, and use sites elsewhere
# are checked normally.
[[tool.mypy.overrides]]
module = "infrahub_solution_ai_dc.protocols"
disable_error_code = ["assignment"]

# PyYAML ships no type information, and the global ignore_missing_imports above does not cover it:
# mypy reports [import-untyped] for an installed package that has a stub package on PyPI, regardless
# of that setting. The stubs are not installed on purpose — this feature added no dependency, and
# yaml is only reached through `safe_dump_all`/`safe_load_all`.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 120

exclude = [
    ".agents",  # installed skills are vendored from opsmill/infrahub-skills; lint upstream
    ".git",
    ".tox",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
]


[tool.ruff.lint]
preview = true

task-tags = ["FIXME", "TODO", "XXX"]

select = ["ALL"]

ignore = [
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "CPY",    # flake8-copyright
    "T201",   # use of `print`
    "ISC",    # flake8-implicit-str-concat
    "COM812", # missing-trailing-comma

    "PT",
    "ERA001", # commented-out code
    "S101",   # use of assert
    "PLR6301",
    "FBT",
    "G004",   # Logging statement uses f-string
    "PLR",
]


#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["infrahub_solution_ai_dc"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 17


[tool.rumdl]
disable = ["MD013", "MD025", "MD029", "MD033", "MD036", "MD041"]
exclude = [
    ".agents/",  # installed skills are vendored from upstream skill repos; lint upstream
    ".claude/",
    ".git/",
    ".kiro/",
    ".specify/",  # spec-kit scaffolding managed by the spec-kit installer
    ".mypy_cache/",
    ".ruff_cache/",
    ".venv/",
    "docs/.docusaurus/",
    "docs/build/",
    "docs/node_modules/",
    "docs/README.md",
    "node_modules/",
]
respect_gitignore = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
