---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreRepository
  data:
    - name: test-repository
      # Bare mirror published by `inv publish-upstream`; a bind-mounted worktree
      # cannot be cloned directly (its .git is a file pointing outside the mount).
      location: "/upstream/.upstream.git"
      # `local` is whatever branch is checked out on the host, under a stable name.
      default_branch: "local"
